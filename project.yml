name: NewsRSSReader

options:
  bundleIdPrefix: net.idscan.lentareader
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

# Общие настройки
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "3ZN8F3XHT4"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# SPM Packages
packages:
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    from: 3.1.4

targets:
  # ===================================
  # SHARED FRAMEWORK
  # ===================================
  NewsRSSReaderShared:
    type: framework
    platform: iOS
    
    deploymentTarget: "16.4"
    sources:
      - NewsRSSReaderShared
    resources:
      - NewsRSSReaderShared/Assets.xcassets
    dependencies:
      - package: SDWebImageSwiftUI
    settings:
      base:
        PRODUCT_NAME: NewsRSSReaderShared
        PRODUCT_BUNDLE_IDENTIFIER: net.idscan.lentareader.NewsRSSReaderShared
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,4"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator watchos watchsimulator"
        ALLOW_TARGET_PLATFORM_SPECIALIZATION: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"

  # ===================================
  # iOS APP
  # ===================================
  NewsRSSReader:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: NewsRSSReader
        excludes:
          - "Model/NewsItem.swift"
          - "Model/ArticleContent.swift"
          - "Services"
          - "Views/HomeViewModel.swift"
          - "ViewComponents/Article"
    dependencies:
      - target: NewsRSSReaderShared
      - package: SDWebImageSwiftUI
    info:
      path: NewsRSSReader/Info.plist
      properties:
        CFBundleDisplayName: "Lenta"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NewsRSSReader/NewsRSSReader.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: net.idscan.lentareader.NewsRSSReader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES

  # ===================================
  # watchOS APP
  # ===================================
  NewsRSSReaderWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - NewsRSSReaderWatch
    dependencies:
      - target: NewsRSSReaderShared
    info:
      path: NewsRSSReaderWatch/Info.plist
      properties:
        CFBundleDisplayName: "Lenta"
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.idscan.lentareader.NewsRSSReader
        WKWatchOnly: false
        WKRunsIndependentlyOfCompanionApp: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NewsRSSReaderWatch/NewsRSSReaderWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: net.idscan.lentareader.NewsRSSReader.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.idscan.lentareader.NewsRSSReader
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

  # ===================================
  # watchOS WIDGET EXTENSION
  # ===================================
  NewsRSSReaderWatchExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: "NewsRSSReaderWatch Extension"
        excludes:
          - "NewsRSSReaderWatch_ExtensionBundle.swift"
          - "NewsRSSReaderWatch_ExtensionControl.swift"
          - "NewsRSSReaderWatch_Extension.swift"
          - "AppIntent.swift"
    dependencies:
      - target: NewsRSSReaderShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: "NewsRSSReaderWatch Extension/Info.plist"
      properties:
        CFBundleDisplayName: "News Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: "NewsRSSReaderWatch Extension/NewsRSSReaderWatch ExtensionExtension.entitlements"
        PRODUCT_BUNDLE_IDENTIFIER: net.idscan.lentareader.NewsRSSReader.watchkitapp.NewsWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        INFOPLIST_KEY_CFBundleDisplayName: "News Widget"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES

schemes:
  NewsRSSReader:
    build:
      targets:
        NewsRSSReaderShared: all
        NewsRSSReader: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  NewsRSSReaderWatch:
    build:
      targets:
        NewsRSSReaderShared: all
        NewsRSSReader: all
        NewsRSSReaderWatch: all
        NewsRSSReaderWatchExtension: all
    run:
      config: Debug
      commandLineArguments:
        TEST_MODE: false
      simulateLocation:
        allow: true
    archive:
      config: Release
