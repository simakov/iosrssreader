name: NewsRSSReader

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "16.4"
    watchOS: "9.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

# Общие настройки
settings:
  base:
    SWIFT_VERSION: "5.9"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# SPM Packages
packages:
  FeedKit:
    url: https://github.com/nmdias/FeedKit.git
    from: 9.1.2
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    from: 3.1.4
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.11.2

targets:
  # ===================================
  # SHARED FRAMEWORK
  # ===================================
  NewsRSSReaderShared:
    type: framework
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - NewsRSSReaderShared
    resources:
      - NewsRSSReaderShared/Assets.xcassets
    dependencies:
      - package: FeedKit
      - package: SwiftSoup
      - package: SDWebImageSwiftUI
    settings:
      base:
        PRODUCT_NAME: NewsRSSReaderShared
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.NewsRSSReaderShared
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,4"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator watchos watchsimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"

  # ===================================
  # iOS APP
  # ===================================
  NewsRSSReader:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: NewsRSSReader
        excludes:
          - "Model/NewsItem.swift"
          - "Model/ArticleContent.swift"
          - "Services"
          - "Views/HomeViewModel.swift"
          - "ViewComponents/Article"
    dependencies:
      - target: NewsRSSReaderShared
      - package: SDWebImageSwiftUI
    info:
      path: NewsRSSReader/Info.plist
      properties:
        CFBundleDisplayName: "Lenta"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.NewsRSSReader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES

  # ===================================
  # watchOS APP
  # ===================================
  NewsRSSReaderWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - NewsRSSReaderWatch
    dependencies:
      - target: NewsRSSReaderShared
    info:
      path: NewsRSSReaderWatch/Info.plist
      properties:
        CFBundleDisplayName: "Lenta"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yourcompany.NewsRSSReader
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.NewsRSSReader.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yourcompany.NewsRSSReader
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

  # ===================================
  # watchOS WIDGET EXTENSION
  # ===================================
  NewsRSSReaderWatchExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: "NewsRSSReaderWatch Extension"
        excludes:
          - "NewsRSSReaderWatch_ExtensionBundle.swift"
          - "NewsRSSReaderWatch_ExtensionControl.swift"
          - "NewsRSSReaderWatch_Extension.swift"
          - "AppIntent.swift"
    dependencies:
      - target: NewsRSSReaderShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: "NewsRSSReaderWatch Extension/Info.plist"
      properties:
        CFBundleDisplayName: "News Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.NewsRSSReader.watchkitapp.NewsWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        INFOPLIST_KEY_CFBundleDisplayName: "News Widget"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES

schemes:
  NewsRSSReader:
    build:
      targets:
        NewsRSSReaderShared: all
        NewsRSSReader: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  NewsRSSReaderWatch:
    build:
      targets:
        NewsRSSReaderShared: all
        NewsRSSReaderWatch: all
        NewsRSSReaderWatchExtension: all
    run:
      config: Debug
    archive:
      config: Release
